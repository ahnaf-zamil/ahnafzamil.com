<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Preloading -->
    <link
      rel="preload"
      href="https://api.fontshare.com/v2/css?f[]=bespoke-stencil@700&display=swap"
      as="style"
    />
    <link
      rel="preload"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,700&display=swap"
      as="style"
    />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap"
      as="style"
    />

    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=bespoke-stencil@700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.css') }}"
    />

    <meta
      name="viewport"
      content="height=device-height,width=device-width, initial-scale=1.0,minimum-scale=1.0"
    />

    <meta
      name="description"
      content="K.M Ahnaf Zamil - Infrastructure & Backend Systems Engineer. I build scalable, distributed systems and high-performance backends. Explore my projects, articles, and technical expertise."
    />

    <meta
      name="keywords"
      content="backend scalability, backend engineer, startup infrastructure, infrastructure audit, cloud architecture, distributed systems, real-time backend, scaling backend, reliability engineering, K.M. Ahnaf Zamil, Ahnaf Zamil, Infrastructure Engineer, Systems Engineer, python, golang"
    />

    <meta name="author" content="K.M Ahnaf Zamil" />

    <meta
      property="og:title"
      content="K.M Ahnaf Zamil | Infrastructure & Backend Systems Engineer"
    />
    <meta
      property="og:description"
      content="Infrastructure & Backend Systems Engineer. I build scalable, distributed systems and high-performance backends. Explore my projects, articles, and technical expertise."
    />
    <meta
      property="og:image"
      content="{{url_for('static', filename='img/logo.png')}}"
    />
    <meta property="og:url" content="https://ahnafzamil.com" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="K.M Ahnaf Zamil | Infrastructure & Backend Systems Engineer"
    />
    <meta
      name="twitter:description"
      content="elping startups build fault-tolerant, scalable infrastructure that doesn't break under growth. Explore projects or request a free infra audit."
    />
    <meta
      name="twitter:image"
      content="{{url_for('static', filename='img/logo.png')}}"
    />
    <link
      rel="icon"
      href="{{url_for('static', filename='img/logo.png')}}"
      type="image/png"
    />
    {% block head_extend %}{% endblock %}
  </head>

  <body class="flex flex-col min-h-screen bg-theme-bg">
    <main class="flex-grow">
      {% from 'macros/common.html' import navbar, footer with context %} {%
      block content %}{% endblock %} {% block scripts %}{% endblock %}
    </main>

    <script>
      window.addEventListener("load", () => {
        const script = document.createElement("script");
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-0CW5THSCGJ";
        script.async = true;
        script.onload = () => {
          window.dataLayer = window.dataLayer || [];
          function gtag() {
            dataLayer.push(arguments);
          }
          gtag("js", new Date());
          gtag("config", "G-0CW5THSCGJ");
        };
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
